# Model arguments
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
ref_model_name_or_path: Qwen/Qwen2.5-14B-Instruct
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments
dataset_mixer:
  data/reformatted/distill-qwen2.5-14B-Instruct: 1.0
dataset_splits:
- train
- test
preprocessing_num_workers: 12

# LoRA arguments
use_peft: true
lora_r: 16
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# DistiLLMTrainer arugments
bf16: true
do_eval: true
eval_steps: 10000000
gradient_accumulation_steps: 8
hub_model_id: qwen
learning_rate: 5.0e-5
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
max_length: 1024
max_prompt_length: 512
num_train_epochs: 1
optim: adamw_torch
output_dir: ./outputs/v2/qwen2.5-1.5B-it-nnm-concatenated-001
run_name: qwen2.5-1.5B-it-nnm
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
push_to_hub: false
# save_strategy: "steps"
# save_steps: 200
# save_total_limit: 20
save_strategy: "epoch"
save_total_limit: 5 
save_only_model: true
seed: 42
warmup_ratio: 0.1
loss_type: distillm_v2
save_safetensors: false

nnm_lambda: 0.1
nnm_K_centroids: 128
nnm_d_prime: 256
nnm_ns_iters: 5
nnm_delay: 200      # steps đầu nnm_loss = 0
nnm_warmup: 200
nnm_n_mid_layers: 4
nnm_chosen_weight: 1.0
nnm_rejected_weight: 1.0
nnm_centroid_batches: 3000
nnm_target: "concatenated"   # "chosen" | "concatenated" | "both"
save_safetensors: false