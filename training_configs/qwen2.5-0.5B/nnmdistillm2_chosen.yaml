# Model arguments
model_name_or_path: Qwen/Qwen2.5-0.5B
ref_model_name_or_path: Qwen/Qwen2.5-Math-1.5B-Instruct
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments
dataset_mixer:
  data/reformatted/distill-qwen2.5-Math-1.5B-Instruct: 1.0
dataset_splits:
  - train
  - test
preprocessing_num_workers: 8

# DistiLLMTrainer arguments
bf16: true
do_eval: true
eval_steps: 10000000
gradient_accumulation_steps: 16
hub_model_id: qwen
learning_rate: 5.0e-5
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
max_length: 1024
max_prompt_length: 512
num_train_epochs: 1
optim: adamw_torch
output_dir: ./outputs/v2/qwen2.5-math-nnm-chosen
run_name: qwen1.5-0.5b-nnm
per_device_train_batch_size: 1
per_device_eval_batch_size: 2
push_to_hub: false
report_to: none
save_strategy: epoch
save_total_limit: 3
save_only_model: true
seed: 42
warmup_ratio: 0.1

# Loss
loss_type: distillm_v2
save_safetensors: false

# NNM arguments — tên field phải khớp với trainer code
nnm_lambda: 0.05
nnm_K_centroids: 128
nnm_d_prime: 256
nnm_ns_iters: 5
nnm_delay: 200      # steps đầu nnm_loss = 0
nnm_warmup: 200     # steps warmup tiếp theo
nnm_n_mid_layers: 4
nnm_chosen_weight: 1.0
nnm_rejected_weight: 1.0
nnm_centroid_batches: 3000
nnm_target: "chosen"   # "chosen" | "concatenated" | "both"

# Qwen2.5-0.5B có 24 layers, Qwen2.5-1.5B có 28 layers
nnm_student_layer_mapping:
  - 8
  - 12
  - 16
  - 20
nnm_teacher_layer_mapping:
  - 9
  - 14
  - 19
  - 23


proj_lr: 5.0e-4