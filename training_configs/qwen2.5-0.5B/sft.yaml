# Model arguments
model_name_or_path: Qwen/Qwen2.5-0.5B
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments
dataset_mixer:
  data/reformatted/sft-qwen2.5-Math-1.5B-Instruct: 1.0
dataset_splits:
- train
preprocessing_num_workers: 12

# DistiLLMTrainer arugments
bf16: true
do_eval: true
eval_steps: 10000000
gradient_accumulation_steps: 8
hub_model_id: qwen
learning_rate: 5.0e-5
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
# max_length: 512
# max_prompt_length: 256
max_seq_length: 1024
max_steps: -1
num_train_epochs: 3
optim: adamw_torch
output_dir: ./outputs/qwen2.5-math-sft
run_name: qwen1.5-0.5b-distillm2
per_device_train_batch_size: 8
per_device_eval_batch_size: 2
push_to_hub: false
# save_strategy: "steps"
# save_steps: 200
# save_total_limit: 20
save_strategy: "epoch"
save_total_limit: 5 
save_only_model: true
seed: 42
warmup_ratio: 0.1
save_safetensors: false
