# Model arguments
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
torch_dtype: bfloat16
attn_implementation: sdpa

# LoRA arguments
use_peft: true
lora_r: 16
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# Data training arguments
dataset_mixer:
  data/reformatted/sft-qwen2.5-14B-Instruct: 1.0
dataset_splits:
- train
preprocessing_num_workers: 12

# DistiLLMTrainer arugments
bf16: true
do_eval: true
eval_steps: 10000000
gradient_accumulation_steps: 8
hub_model_id: qwen
learning_rate: 5.0e-5
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
# max_length: 512
# max_prompt_length: 256
max_seq_length: 1024
max_steps: -1
num_train_epochs: 3
optim: adamw_torch
output_dir: ./outputs/qwen2.5-1.5B-it-sft
run_name: qwen2.5-1.5B-it-sft
per_device_train_batch_size: 1
per_device_eval_batch_size: 2
push_to_hub: false
# save_strategy: "steps"
# save_steps: 200
# save_total_limit: 20
save_strategy: "epoch"
save_total_limit: 5 
save_only_model: true
seed: 42
warmup_ratio: 0.1
save_safetensors: false
