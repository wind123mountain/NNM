# Model arguments
model_name_or_path: Qwen/Qwen2.5-0.5B
ref_model_name_or_path: Qwen/Qwen2.5-Math-1.5B-Instruct
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments
dataset_mixer:
  data/reformatted/qwen_math: 1.0
dataset_splits:
- train
- test
preprocessing_num_workers: 12

# DistiLLMTrainer arugments
bf16: true
do_eval: true
eval_steps: 10000000
gradient_accumulation_steps: 4
hub_model_id: qwen
learning_rate: 5.0e-5
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
max_length: 512
max_prompt_length: 256
num_train_epochs: 2
optim: adamw_torch
output_dir: ./outputs/qwen2.5-math-nnmdistillm2
run_name: qwen1.5-0.5b-distillm2
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
push_to_hub: false
# save_strategy: "steps"
# save_steps: 200
# save_total_limit: 20
save_strategy: "epoch"
save_total_limit: 5 
save_only_model: true
seed: 42
warmup_ratio: 0.1
loss_type: distillm_v2

# NNM arguments — tên field phải khớp với trainer code
nnm_lambda: 0.05
nnm_K_centroids: 128
nnm_d_prime: 256
nnm_ns_iters: 5
nnm_warmup: 400
nnm_n_mid_layers: 4
nnm_chosen_weight: 1.0
nnm_rejected_weight: 1.0
nnm_centroid_batches: 3000
nnm_target: "concatenated"   # "chosen" | "concatenated" | "both"
save_safetensors: false

nnm_student_layer_mapping:
  - 14
  - 16
  - 18
  - 20
  - 22
  - 23
nnm_teacher_layer_mapping:
  - 18
  - 20
  - 22
  - 24
  - 26
  - 27

proj_lr: 5.0e-4