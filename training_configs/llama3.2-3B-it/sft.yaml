# Model arguments
model_name_or_path: meta-llama/Llama-3.2-3B-Instruct
torch_dtype: bfloat16
attn_implementation: sdpa
# LoRA arguments
use_peft: true
lora_r: 16
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# Data training arguments
dataset_mixer:
  data/reformatted/sft-deepSeek-R1-Distill-Llama-8B: 1.0
dataset_splits:
- train
preprocessing_num_workers: 12

# DistiLLMTrainer arugments
bf16: true
do_eval: true
eval_steps: 10000000
gradient_accumulation_steps: 16
hub_model_id: llama
learning_rate: 5.0e-5
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
max_seq_length: 1024
max_steps: -1
num_train_epochs: 3
optim: adamw_torch
output_dir: ./outputs/llama-3.2-3B-it-sft
run_name: llama-3.2-3B-it-sft
per_device_train_batch_size: 4
per_device_eval_batch_size: 2
push_to_hub: false
save_strategy: "epoch"
save_total_limit: 5 
save_only_model: true
seed: 42
warmup_ratio: 0.1
save_safetensors: false
